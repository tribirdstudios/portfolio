---
layout: default
---
<article class="wrap post">
  <p class="post-meta"><a href="/blog/">← All posts</a></p>
  <h1>{{ page.title | escape }}</h1>
  <time class="post-meta" datetime="{{ page.date | date: '%Y-%m-%d' }}">{{ page.date | date: "%-d %B %Y" }}</time>
  <div class="post-body">
    {{ content }}
  </div>
  <div class="post-foot">
    <p>Making something that needs music?</p>
    <a class="btn primary" href="/commissions.html#brief">Tell me about your project</a>
  </div>
</article>
