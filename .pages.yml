# Config for Pages CMS (pagescms.org). It turns the files in this repo into simple forms.
media:
  input: assets/uploads
  output: /assets/uploads

content:
  - name: status
    label: Commission status
    type: file
    path: _data/status.yml
    fields:
      - name: availability
        label: Are you taking commissions?
        type: select
        options:
          values:
            - { value: open, label: "Open" }
            - { value: limited, label: "Limited availability" }
            - { value: closed, label: "Closed" }
      - name: open
        label: "Text when Open"
        type: object
        fields:
          - { name: badge, label: "Badge (small label on the Commissions page)", type: string }
          - { name: commissions_text, label: "Paragraph on the Commissions page", type: text }
          - { name: home_text, label: "Paragraph on the Home page", type: text }
      - name: limited
        label: "Text when Limited availability"
        type: object
        fields:
          - { name: badge, label: "Badge (small label on the Commissions page)", type: string }
          - { name: commissions_text, label: "Paragraph on the Commissions page", type: text }
          - { name: home_text, label: "Paragraph on the Home page", type: text }
      - name: closed
        label: "Text when Closed"
        type: object
        fields:
          - { name: badge, label: "Badge (small label on the Commissions page)", type: string }
          - { name: commissions_text, label: "Paragraph on the Commissions page", type: text }
          - { name: home_text, label: "Paragraph on the Home page", type: text }

  - name: home
    label: Home page
    type: file
    path: _data/home.yml
    fields:
      - { name: hero_lines, label: "Intro lines under the title", type: text, list: true }
      - name: feature
        label: "Featured track"
        type: object
        fields:
          - { name: title, label: "Track name", type: string }
          - { name: text, label: "Why this one", type: text }
          - name: embed_url
            label: "Spotify embed address"
            type: string
            description: "On Spotify: Share, Embed, then copy the address after src=."
      - { name: work_title, label: "Heading above the cards", type: string }
      - name: cards
        label: "Cards"
        type: object
        list: true
        fields:
          - { name: title, label: "Title", type: string }
          - { name: tag, label: "Small label", type: string }
          - { name: text, label: "Description", type: text }
          - { name: link_text, label: "Link text", type: string }
          - { name: url, label: "Link address (e.g. /portfolio.html#ore)", type: string }
          - name: color
            label: Colour
            type: select
            options:
              values:
                - { value: jay, label: Blue }
                - { value: cardinal, label: Red }
                - { value: hummer, label: Green }
      - { name: cta_title, label: "Heading above the commission button", type: string }
      - { name: support_text, label: "Ko-fi support text", type: text }

  - name: portfolio
    label: Portfolio
    type: file
    path: _data/portfolio.yml
    fields:
      - { name: lede, label: "Intro at the top", type: text }
      - name: album
        label: "Album with players"
        type: object
        fields:
          - { name: title, label: "Title", type: string }
          - { name: text, label: "Description", type: text }
          - name: tracks
            label: "Tracks"
            type: object
            list: true
            fields:
              - { name: title, label: "Track name", type: string }
              - { name: aria_label, label: "Plain spelling (only if the title is styled, like T U R N B A C K)", type: string }
              - { name: tag, label: "Small label (e.g. Underwater world)", type: string }
              - { name: params, label: "What the wheel picked (one per line)", type: string, list: true }
              - { name: text, label: "About the track", type: text }
              - name: embed_url
                label: "Spotify embed address"
                type: string
                description: "On Spotify: the track, Share, Embed, then copy the address after src=."
              - name: color
                label: Colour
                type: select
                options:
                  values:
                    - { value: jay, label: Blue }
                    - { value: cardinal, label: Red }
                    - { value: hummer, label: Green }
      - name: ore
        label: "Ore"
        type: object
        fields:
          - { name: title, label: "Title", type: string }
          - { name: text, label: "Description", type: text }
          - { name: link_text, label: "Link text", type: string }
          - { name: url, label: "Link address", type: string }
      - name: commission
        label: "Commissioned D&D music"
        type: object
        fields:
          - { name: title, label: "Title", type: string }
          - { name: text, label: "Description", type: text }
          - { name: quote, label: "Client quote (leave empty for none)", type: text }
          - { name: quote_by, label: "Who said it", type: string }
      - name: osts
        label: "OSTs Reimagined"
        type: object
        fields:
          - { name: title, label: "Title", type: string }
          - { name: text, label: "Description", type: text }
          - name: tracks
            label: "Tracks"
            type: object
            list: true
            fields:
              - { name: title, label: "Track name", type: string }
              - { name: tag, label: "Small label (e.g. Inspired by Hollow Knight)", type: string }
              - { name: text, label: "About the track", type: text }
              - { name: embed_url, label: "Spotify embed address (optional)", type: string }
              - name: color
                label: Colour
                type: select
                options:
                  values:
                    - { value: jay, label: Blue }
                    - { value: cardinal, label: Red }
                    - { value: hummer, label: Green }
          - { name: link_text, label: "Link text", type: string }
          - { name: url, label: "Link address", type: string }
      - name: more
        label: "Everything else"
        type: object
        fields:
          - { name: embed_url, label: "Spotify embed address", type: string }
          - { name: videos_show, label: "Show the latest YouTube videos", type: boolean }
          - { name: channel_id, label: "YouTube channel ID (starts with UC)", type: string }
      - { name: cta_text, label: "Text above the bottom button", type: text }

  - name: commissions
    label: Commissions page
    type: file
    path: _data/commissions.yml
    fields:
      - { name: intro, label: "Intro paragraph", type: text }
      - { name: deliver, label: "What you'll get (one per line)", type: text, list: true }
      - { name: steps, label: "How it works (use **double stars** for the bold start)", type: text, list: true }
      - name: services
        label: "What I can make"
        type: object
        list: true
        fields:
          - { name: title, label: "Title", type: string }
          - { name: text, label: "Description", type: text }
          - name: color
            label: Colour
            type: select
            options:
              values:
                - { value: jay, label: Blue }
                - { value: cardinal, label: Red }
                - { value: hummer, label: Green }
                - { value: muted, label: Grey }
      - name: packages
        label: "Packages"
        type: object
        list: true
        fields:
          - { name: title, label: "Title", type: string }
          - { name: text, label: "Description", type: text }
          - name: color
            label: Colour
            type: select
            options:
              values:
                - { value: jay, label: Blue }
                - { value: cardinal, label: Red }
                - { value: hummer, label: Green }
                - { value: muted, label: Grey }
      - { name: pricing_note, label: "Line about pricing", type: text }
      - { name: brief_intro, label: "Text above the form", type: text }
      - { name: budget_options, label: "Budget choices in the form", type: string, list: true }
      - name: faq
        label: "FAQ"
        type: object
        list: true
        fields:
          - { name: q, label: "Question", type: string }
          - { name: a, label: "Answer", type: text }

  - name: about
    label: About page
    type: file
    path: _data/about.yml
    fields:
      - { name: paragraphs, label: "About text (one entry per paragraph; links look like [words](https://address))", type: text, list: true }
      - { name: photo, label: "Photo (optional)", type: image }
      - { name: support_text, label: "Ko-fi text", type: text }
      - { name: contact_text, label: "Contact line", type: string }

  - name: links
    label: Social links and contact
    type: file
    path: _data/links.yml
    fields:
      - name: items
        label: Links
        type: object
        list: true
        fields:
          - { name: name, label: "Name", type: string }
          - { name: url, label: "Address", type: string }
          - { name: contact_name, label: "Different name on the About page (optional)", type: string }

  - name: settings
    label: Email and Ko-fi
    type: file
    path: _data/site.yml
    fields:
      - { name: email, label: "Contact email", type: string }
      - { name: kofi_url, label: "Ko-fi address", type: string }
      - { name: footer_kofi_text, label: "Ko-fi text in the footer", type: text }

  - name: posts
    label: Blog posts
    type: collection
    path: _posts
    filename: "{year}-{month}-{day}-{primary}.md"
    format: yaml-frontmatter
    view:
      fields: [title, date, published]
      primary: title
      sort: [date]
      default:
        sort: date
        order: desc
    fields:
      - { name: title, label: "Title", type: string }
      - { name: date, label: "Date", type: date, options: { time: true } }
      - { name: description, label: "Short summary (shows on the blog list and in link previews)", type: text }
      - { name: published, label: "Published (switch off to keep it as a draft)", type: boolean, default: true }
      - { name: image, label: "Preview image (optional)", type: image }
      - { name: body, label: "Post", type: rich-text }
