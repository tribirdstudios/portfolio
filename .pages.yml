# Config for Pages CMS (pagescms.org). It turns the files in this repo into simple forms.
media:
  input: assets/uploads
  output: /assets/uploads

content:
  - name: status
    label: Commission status
    type: file
    path: _data/status.yml
    fields:
      - name: availability
        label: Are you taking commissions?
        type: select
        options:
          values:
            - { value: open, label: "Open" }
            - { value: waitlist, label: "Waitlist (booking for later)" }
            - { value: closed, label: "Closed" }
      - { name: status_open, label: "Badge text when Open", type: string }
      - { name: status_waitlist, label: "Badge text when Waitlist", type: string }
      - { name: status_closed, label: "Badge text when Closed", type: string }
      - name: closed_message
        label: "Note above the form when not Open"
        type: text

  - name: home
    label: Home page text
    type: file
    path: _data/home.yml
    fields:
      - { name: email, label: "Contact email", type: string }
      - { name: hero_lede, label: "Intro line under the title", type: text }
      - { name: hero_note, label: "Small note under the buttons", type: string }
      - name: release
        label: "New release banner"
        type: object
        fields:
          - { name: show, label: "Show the banner", type: boolean }
          - { name: tag, label: "Tag (e.g. New release)", type: string }
          - { name: title, label: "Title", type: string }
          - { name: text, label: "Short description", type: text }
          - { name: link_text, label: "Link text", type: string }
          - { name: url, label: "Link address", type: string }
      - { name: commissions_intro, label: "Commissions intro", type: text }
      - name: steps
        label: "How it works (steps)"
        type: text
        list: true
        description: "Use **double stars** around the bold part."
      - { name: form_intro, label: "Text at the top of the form", type: text }
      - { name: budget_options, label: "Budget choices in the form", type: string, list: true }
      - name: about
        label: "About (one entry per paragraph)"
        type: text
        list: true
        description: "Links look like [words](https://address)."
      - { name: about_photo, label: "About photo (optional)", type: image }
      - { name: contact_text, label: "Contact line", type: string }
      - { name: support_title, label: "Support heading", type: string }
      - { name: support_text, label: "Support text", type: text }
      - { name: kofi_url, label: "Ko-fi address", type: string }

  - name: listen
    label: Listen (tracks and videos)
    type: file
    path: _data/listen.yml
    fields:
      - { name: intro, label: "Line above the player", type: string }
      - name: players
        label: "Players (each one is a tab)"
        type: object
        list: true
        fields:
          - { name: name, label: "Tab name", type: string }
          - name: embed_url
            label: "Embed address"
            type: string
            description: "On Spotify, SoundCloud or YouTube: Share, then Embed, then copy the address after src=."
      - name: videos
        label: "YouTube videos"
        type: object
        fields:
          - { name: show, label: "Show the latest videos", type: boolean }
          - { name: channel_id, label: "Channel ID (starts with UC)", type: string }

  - name: projects
    label: Projects
    type: file
    path: _data/projects.yml
    fields:
      - name: items
        label: Projects
        type: object
        list: true
        fields:
          - { name: title, label: "Title", type: string }
          - { name: tag, label: "Small label (e.g. Concept album, 12 tracks)", type: string }
          - { name: text, label: "Description", type: text }
          - { name: link_text, label: "Link text", type: string }
          - { name: url, label: "Link address", type: string }
          - name: color
            label: "Colour"
            type: select
            options:
              values:
                - { value: jay, label: "Blue" }
                - { value: cardinal, label: "Red" }
                - { value: hummer, label: "Green" }

  - name: services
    label: What I can make
    type: file
    path: _data/services.yml
    fields:
      - name: items
        label: Services
        type: object
        list: true
        fields:
          - { name: title, label: "Title", type: string }
          - { name: text, label: "Description", type: text }
          - name: color
            label: "Colour"
            type: select
            options:
              values:
                - { value: jay, label: "Blue" }
                - { value: cardinal, label: "Red" }
                - { value: hummer, label: "Green" }
                - { value: muted, label: "Grey" }

  - name: links
    label: Social links
    type: file
    path: _data/links.yml
    fields:
      - name: items
        label: Links
        type: object
        list: true
        fields:
          - { name: name, label: "Name", type: string }
          - { name: url, label: "Address", type: string }
          - name: icon
            label: "Icon"
            type: select
            options:
              values:
                - { value: soundcloud, label: SoundCloud }
                - { value: spotify, label: Spotify }
                - { value: instagram, label: Instagram }
                - { value: youtube, label: YouTube }
                - { value: kofi, label: Ko-fi }
                - { value: other, label: "Other (link icon)" }
          - { name: in_header, label: "Show in the top bar", type: boolean }

  - name: posts
    label: Blog posts
    type: collection
    path: _posts
    filename: "{year}-{month}-{day}-{primary}.md"
    format: yaml-frontmatter
    view:
      fields: [title, date, published]
      primary: title
      sort: [date]
      default:
        sort: date
        order: desc
    fields:
      - { name: title, label: "Title", type: string }
      - { name: date, label: "Date", type: date, options: { time: true } }
      - { name: description, label: "Short summary (shows on the blog list and in link previews)", type: text }
      - { name: published, label: "Published (switch off to keep it as a draft)", type: boolean, default: true }
      - { name: image, label: "Preview image (optional)", type: image }
      - { name: body, label: "Post", type: rich-text }
