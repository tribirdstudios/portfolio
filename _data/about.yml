paragraphs:
  - "I'm Nick, the musician and composer behind TriBird Studios. Music has always been a major part of my life, with 20 years of piano training, 15 of violin, and some experience on other instruments. During my studies I won several local piano competitions and trained under the composer and pianist [Joseph Fennimore](https://en.wikipedia.org/wiki/Joseph_Fennimore)."
  - "I started composing to combine two of my passions: music, and video games and film. I believe music can lift visual media to a new level, creating deeper immersion and emotion for the audience."
photo: ""
support_text: "TriBird Studios is independent. If you enjoy the music and want to help fund future albums, you can support me on Ko-fi."
