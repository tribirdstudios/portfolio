commissions_intro: "I write original music for indie games, short films, documentaries, tabletop campaigns, and anything else that needs a soundtrack. Every piece is written specifically for your project."
steps:
  - "**Tell me about your project.** The genre, mood, any references you like, and where the music will be used."
  - "**I send a sketch.** A short draft of the main idea, so we agree on a direction early."
  - "**We refine it together.** We go through revisions until it fits, and then I deliver the final files in whatever format you need."
form_intro: "Tell me about your project and I'll get back to you personally, usually within a few days."
