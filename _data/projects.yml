items:
  - tag: Concept album, 12 tracks
    title: Songs for Games That Don't Exist — Volume I
    text: I spun a set of wheels to choose the genre, mood and instruments for each track, as a way to practice writing in every style. The twelve results became my first concept album.
    link_text: Listen to the album
    url: https://open.spotify.com/album/3WBeSrrkZa0GJB52iRVq2J
    color: jay
  - tag: Concept album, coming soon
    title: Ore
    text: My second concept album. Twelve tracks ordered by depth, from emerald down to ancient debris, tied together by a pickaxe theme on xylophone.
    link_text: Follow the series on Instagram
    url: https://www.instagram.com/tribirdstudios/
    color: cardinal
