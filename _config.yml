# Site settings. You normally never need to touch this file.
title: TriBird Studios
url: https://www.tribirdstudios.com
timezone: Europe/London
future: true
markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false
exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
defaults:
  - scope:
      path: ""
      type: posts
    values:
      permalink: /blog/:title/
