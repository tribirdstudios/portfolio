<style>
  :root {
    --bg: #EEF2EA; --surface: #E1E8DB; --text: #17301F; --muted: #4B6352;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --bg: #13261A; --surface: #1B3424; --text: #E6EEE2; --muted: #A8BCAB; color-scheme: dark; }
  }
  :root[data-theme="dark"] { --bg: #13261A; --surface: #1B3424; --text: #E6EEE2; --muted: #A8BCAB; color-scheme: dark; }

  *, *::before, *::after { box-sizing: border-box; }
  :root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 400 1.125rem/1.6 "Alegreya Sans", "Segoe UI", system-ui, sans-serif;
    display: grid; place-items: center; text-align: center; padding: 2rem 1.25rem;
  }
  main { max-width: 32rem; }
  img { width: min(200px, 50vw); height: auto; display: block; margin: 0 auto 1.5rem; }
  .code { font-weight: 700; letter-spacing: .15em; color: var(--muted); margin: 0; }
  h1 { font-family: "Uncial Antiqua", Georgia, serif; font-weight: 400; font-size: clamp(2.2rem, 7vw, 3.25rem); line-height: 1.15; margin: .25rem 0 1rem; }
  p { color: var(--muted); margin: 0 0 2rem; }
  p a { color: var(--text); text-underline-offset: 3px; }
  .btn { display: inline-block; padding: .75rem 1.3rem; border-radius: 999px; font-weight: 700; text-decoration: none; border: 2px solid var(--text); background: var(--text); color: var(--bg); }
  .btn:hover { background: var(--surface); color: var(--text); }
  .btn:focus-visible { outline: 3px solid var(--muted); outline-offset: 3px; }
</style>
</head>
<body>
